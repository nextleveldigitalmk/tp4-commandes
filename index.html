<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-light">

    <header class="py-4 border-bottom border-secondary bg-dark">
        <div class="container">
            <h1 class="h3 fw-bold mb-1 text-danger">Tableau de Bord des Commandes</h1>
        </div>
    </header>

    <main class="container py-4">
        <div id="errorMessage" class="alert alert-danger d-none mb-4" role="alert"></div>

        <section class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card bg-dark border-secondary p-3">
                    <p class="text-muted small mb-1 text-uppercase">Clients</p>
                    <h3 id="totalCustomers" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card bg-dark border-secondary p-3">
                    <p class="text-muted small mb-1 text-uppercase">Produits</p>
                    <h3 id="totalProducts" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card bg-dark border-secondary p-3">
                    <p class="text-muted small mb-1 text-uppercase">Commandes</p>
                    <h3 id="totalOrders" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card bg-dark border-secondary p-3">
                    <p class="text-muted small mb-1 text-uppercase">Chiffre d'Affaires</p>
                    <h3 id="totalRevenue" class="fw-bold mb-0 text-success">0 MAD</h3>
                </div>
            </div>
        </section>

        <section class="card bg-dark border-secondary p-4 mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchInput" class="form-label small text-muted">Rechercher par client</label>
                    <input type="text" id="searchInput" class="form-control bg-black text-light border-secondary" placeholder="Nom du client...">
                </div>
                <div class="col-md-4">
                    <label for="statusFilter" class="form-label small text-muted">Filtrer par statut</label>
                    <select id="statusFilter" class="form-select bg-black text-light border-secondary">
                        <option value="all">Tous les statuts</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="categoryFilter" class="form-label small text-muted">Filtrer par catégorie produit</label>
                    <select id="categoryFilter" class="form-select bg-black text-light border-secondary">
                        <option value="all">Toutes les catégories</option>
                        <option value="Informatique">Informatique</option>
                        <option value="Mobilier">Mobilier</option>
                        <option value="Electroménager">Electroménager</option>
                    </select>
                </div>
            </div>
        </section>

        <p id="resultCount" class="text-muted mb-3">Chargement des données...</p>

        <section id="ordersContainer" class="row g-4"></section>
    </main>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Détails de la Commande #<span id="modalOrderId"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Client :</strong> <span id="modalCustomerName"></span></p>
                    <p><strong>Ville :</strong> <span id="modalCustomerCity"></span></p>
                    <p><strong>Date :</strong> <span id="modalDate"></span></p>
                    <p><strong>Statut :</strong> <span id="modalStatus" class="badge"></span></p>
                    <hr class="border-secondary">
                    <p class="fw-semibold">Produits commandés :</p>
                    <ul id="modalItemsList" class="list-group mb-3"></ul>
                    <div class="d-flex justify-content-between align-items-center bg-black p-3 rounded border border-secondary">
                        <span class="fw-bold">Montant Total :</span>
                        <span id="modalTotal" class="fw-bold text-success fs-4"></span>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.5net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
